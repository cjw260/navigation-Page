worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  resolver 127.0.0.11 valid=30s ipv6=off;
  limit_conn_zone $server_name zone=admin_connections:1m;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    location = /healthz { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
    location = / {
      root /data/public;
      etag off;
      if_modified_since off;
      add_header Cache-Control "no-store" always;
      try_files /index.html @builtin;
    }
    location = /index.html {
      root /data/public;
      etag off;
      if_modified_since off;
      add_header Cache-Control "no-store" always;
      try_files /index.html @builtin;
    }
    location @builtin { try_files /index.html =503; add_header Cache-Control "no-store" always; }
    location = /navigation-admin { return 308 /navigation-admin/; }
    location ^~ /navigation-admin/ {
      client_max_body_size 40m;
      client_body_timeout 120s;
      limit_conn admin_connections 12;
      set $admin_backend http://admin:8080;
      proxy_pass $admin_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_request_buffering off;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ^~ /navigation-media/ {
      alias /data/public/media/;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff;
    }
    location ~ "^/assets/previews/[a-z_]+\.[a-f0-9]{12}\.mp4$" {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /assets/project-previews.mjs {
      types { application/javascript mjs; }
      add_header Cache-Control "no-cache";
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
  }
}
