services:
  web:
    image: ${WEB_IMAGE:?Missing immutable web image}
    ports: ["127.0.0.1:18080:8080"]
    mem_limit: 96m
    cpus: 0.5
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
