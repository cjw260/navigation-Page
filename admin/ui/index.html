<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; form-action 'self'; base-uri 'none'"><title>项目管理 · CAIN</title><link rel="stylesheet" href="/navigation-admin/admin.css"><script src="/navigation-admin/admin.js" defer></script></head>
<body><header><div><p class="eyebrow">CAIN / 项目管理</p><h1>管理首页项目</h1></div><a href="/" target="_blank" rel="noopener">查看首页 ↗</a></header><main>
<section id="login" class="panel narrow" hidden><h2>管理员登录</h2><p>项目内容先保存为草稿，确认预览后再发布。</p><form id="login-form"><label>账号<input name="username" value="admin" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">登录</button></form><p class="hint">首次使用需在服务器设置密码。后台没有公开注册或在线初始化入口。</p></section>
<section id="app" hidden><div class="toolbar"><p id="publication"></p><button id="logout" class="secondary">退出登录</button></div><fieldset id="controls"><div class="workspace"><aside class="panel"><div class="section-heading"><h2>项目列表</h2><button id="add" class="secondary" type="button">＋ 新增</button></div><p class="hint">使用 ↑ ↓ 调整首页顺序；隐藏项目会保留素材。</p><div id="projects"></div></aside><section class="panel" id="editor"><div id="empty">选择或新增一个项目</div><div id="fields" hidden><div class="section-heading"><h2>项目内容</h2><span id="visibility-label"></span></div><label>项目名称<input id="title" maxlength="120" placeholder="例如：在线简历制作"></label><label>简短介绍<input id="subtitle" maxlength="160" placeholder="显示在卡片名称上方"></label><label>项目地址<input id="url" maxlength="2048" placeholder="https://resume.cjw32.xyz/ 或 /blog/"></label><label class="check"><input id="visible" type="checkbox">在首页显示</label><div class="media-grid"><div><label>封面图片<input id="cover-file" type="file" accept="image/jpeg,image/png,image/webp"></label><p class="hint">JPG / PNG / WebP，最大 15 MiB。自动生成适合卡片的图片。</p><img id="cover-preview" alt="项目封面预览" hidden></div><div><label>悬停展示视频（可选）<input id="video-file" type="file" accept="video/mp4,video/webm"></label><p class="hint">MP4 / WebM，最大 40 MiB。保留原文件，自动生成前 12 秒无声轻量预览。</p><p id="video-state"></p><button id="clear-video" type="button" class="secondary">取消使用视频</button></div></div><button id="remove" type="button" class="danger">从草稿移除这个项目</button></div></section></div><div class="publish-bar"><span id="draft-state">草稿已保存</span><div class="actions"><button id="save" type="button" class="secondary">保存草稿</button><button id="preview" type="button" class="secondary">保存并预览</button><button id="publish" type="button" disabled>发布到首页</button></div></div></fieldset><p class="hint">发布按钮在预览后启用。修改任何内容后，需要重新预览。素材和项目数据独立保存，不会被代码更新覆盖。</p></section>
<p id="message" role="status" aria-live="polite"></p></main></body></html>
